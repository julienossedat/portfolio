<h1 class="st" style="margin-top:56px">Contact</h1>
<p class="intro">Un projet, une collaboration, une offre de stage ? Écris-moi, je réponds par e-mail.</p>
<div class="panel" style="max-width:660px">
<form id="cf" action="https://formsubmit.co/julien.ossedat1@gmail.com" method="POST">
<input type="hidden" name="_subject" value="Nouveau message depuis ton portfolio">
<input type="hidden" name="_template" value="table">
<input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">
<label>Nom<input type="text" name="name" required autocomplete="name"></label>
<label>E-mail<input type="email" name="email" required autocomplete="email"></label>
<label>Message<textarea name="message" rows="6" required></textarea></label>
<button class="btn" type="submit">Envoyer le message</button>
<p id="cs" role="status"></p>
</form>
</div>
